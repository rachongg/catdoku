<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Catdoku</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: the colored cat-bed board as the hero, a rules + tools column beside it; stacks on phones */
:root {
  --bg: #F7F1F6;
  --surface: #FFFFFF;
  --ink: #43364F;
  --muted: #85779A;
  --grid: rgba(67,54,79,.10);
  --line-strong: #8A7A9C;
  --accent: #E784A8;
  --accent-ink: #FFFFFF;
  --bad: #E2506E;
  --mark: #8A7A9C;
  --frame: #9C86A8;
  --tray: #FFFBF7;
  --cat-rim: #5A4560;
  --shadow: 0 1px 0 rgba(67,54,79,.04), 0 8px 24px rgba(180,140,190,.18);
  --r1: #FFDCE3; --r2: #FFE6CF; --r3: #FFF6CC; --r4: #DDF4D6; --r5: #CFF1EC;
  --r6: #D6E6FF; --r7: #E7DDFF; --r8: #FCDCF2; --r9: #F0EADF;
  --font-display: "M PLUS Rounded 1c", "Nunito", ui-rounded, system-ui, sans-serif;
  --font-body: "Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1A24; --surface: #2A2531; --ink: #F4ECF6; --muted: #B7A9C4; --grid: rgba(0,0,0,.18);
    --line-strong: #15111A; --accent: #F2A6C2; --accent-ink: #3A1626; --bad: #FF7F98; --mark: #F4ECF6; --frame: #5E4F6A; --tray: #2F2937;
    --cat-rim: #2A2030; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    --r1: #7C5662; --r2: #7C6450; --r3: #767052; --r4: #587056; --r5: #4E6F6B; --r6: #556887;
    --r7: #675C85; --r8: #7A5674; --r9: #6A645B;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1A24; --surface: #2A2531; --ink: #F4ECF6; --muted: #B7A9C4; --grid: rgba(0,0,0,.18);
  --line-strong: #15111A; --accent: #F2A6C2; --accent-ink: #3A1626; --bad: #FF7F98; --mark: #F4ECF6; --frame: #5E4F6A; --tray: #2F2937;
  --cat-rim: #2A2030; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  --r1: #7C5662; --r2: #7C6450; --r3: #767052; --r4: #587056; --r5: #4E6F6B; --r6: #556887;
  --r7: #675C85; --r8: #7A5674; --r9: #6A645B;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 6vw, 48px);
  line-height: 1; margin: 0; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px;
}
h1 svg { width: 1.05em; height: 1.05em; }
.tag { color: var(--muted); margin: 6px 0 0; font-weight: 600; }
.stats { display: flex; gap: 8px; }
.stat {
  background: var(--surface); border-radius: 12px; padding: 6px 12px; min-width: 76px;
  box-shadow: var(--shadow); display: flex; flex-direction: column;
}
.stat b { font-family: var(--font-display); font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 800; }

/* One centered column: hearts, board, hint. Board and hint share a width that fits the screen height. */
.game {
  --board: min(100%, 560px, calc(100dvh - 240px));
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}

.board-wrap { min-width: 0; width: 100%; display: flex; justify-content: center; }
.board {
  --n: 7;
  width: var(--board); min-width: min(100%, 280px); aspect-ratio: 1; max-width: 100%;
  display: grid; grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: repeat(var(--n), 1fr);
  background: var(--tray); border: 6px solid var(--frame); border-radius: 28px; overflow: hidden;
  padding: 3%; gap: 1.3%;
  box-shadow: var(--shadow); user-select: none; -webkit-user-select: none; touch-action: none;
}
.cell {
  position: relative; border: 0; padding: 0; margin: 0; color: inherit; border-radius: 16%;
  display: grid; place-items: center; cursor: pointer; font: inherit; min-width: 0; min-height: 0;
}
.cell:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; z-index: 1; }
.cell .cat { width: 80%; height: 80%; }
.cell.placed .cat { animation: pop .28s cubic-bezier(.3,1.6,.5,1); }
.cell.bad::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  border: 3px solid var(--bad); pointer-events: none;
}
.cell.bad .cat { animation: shake .35s; }
.cell .x { width: 34%; height: 34%; color: var(--mark); opacity: .7; }
.cell .x.known { color: var(--bad); opacity: .85; }
.cell.oops .x { animation: shake .4s; }
.status { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.hearts { display: flex; gap: 6px; justify-content: center; }
.hearts svg { width: 30px; height: 30px; transition: transform .3s; }
.hearts .full { color: var(--accent); }
.hearts .lost { color: var(--grid); transform: scale(.85); }
.hearts.hit svg:not(.full):first-of-type { animation: shake .4s; }
@keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10%); } 75% { transform: translateX(10%); } }

.panel { display: flex; flex-direction: column; gap: 16px; width: var(--board); min-width: min(100%, 280px); max-width: 100%; }
.group { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; color: var(--muted); }
.seg { display: flex; background: var(--surface); border-radius: 12px; padding: 4px; gap: 4px; box-shadow: var(--shadow); }
.seg button {
  flex: 1; border: 0; background: transparent; color: var(--ink); font: inherit; font-weight: 800;
  padding: 8px 4px; border-radius: 9px; cursor: pointer; font-variant-numeric: tabular-nums;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn {
  border: 0; font: inherit; font-weight: 800; cursor: pointer; border-radius: 12px; padding: 10px 14px;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: default; }
.tools { display: grid; grid-template-columns: 1fr; gap: 8px; }
.tools .btn svg { width: 20px; height: 20px; }
.tools .btn svg { width: 20px; height: 20px; }

.rules {
  background: var(--surface); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 8px;
}
.rules ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-weight: 600; }
.rules ol li::marker { font-weight: 800; color: var(--accent); }
.howto { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; font-weight: 700; flex-wrap: wrap; }
.howto .chip { display: inline-flex; align-items: center; gap: 4px; }
.howto .sq {
  width: 22px; height: 22px; border-radius: 5px; background: var(--r6); display: grid; place-items: center;
  box-shadow: inset 0 0 0 1px var(--grid);
}
.howto .sq svg { width: 80%; height: 80%; }
.howto .sq .x { width: 45%; height: 45%; color: var(--mark); opacity: .7; }

.opts { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-weight: 700; font-size: 14px; }
.opts label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.opts input { accent-color: var(--accent); width: 16px; height: 16px; }
.help { color: var(--muted); font-size: 13px; margin: 0; max-width: 60ch; }
kbd {
  font-family: var(--font-body); font-weight: 800; font-size: 12px; background: var(--surface);
  border-radius: 5px; padding: 0 5px; box-shadow: inset 0 -1px 0 var(--grid);
}

.overlay {
  position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 70%, transparent);
  backdrop-filter: blur(4px); display: grid; place-items: center; z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  background: var(--surface); border-radius: 20px; padding: 28px 24px; box-shadow: var(--shadow);
  text-align: center; max-width: 380px; width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center;
}
.card h2 { font-family: var(--font-display); font-size: 32px; margin: 0; line-height: 1.1; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-weight: 700; }
.card .row { display: flex; gap: 8px; }
.parade { display: flex; justify-content: center; gap: 2px; flex-wrap: wrap; }
.parade svg { width: 36px; height: 36px; animation: hop .9s ease-in-out infinite; }
@keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--surface); padding: 8px 16px; border-radius: 999px; font-weight: 800;
  z-index: 30; font-size: 14px;
}
/* Phones: keep the whole game on one screen, board as wide as possible, big tap targets. */
html { -webkit-text-size-adjust: 100%; }
.board { -webkit-touch-callout: none; }
.cell { -webkit-tap-highlight-color: transparent; }
.btn { min-height: 48px; touch-action: manipulation; }
@media (max-width: 820px) {
  .wrap { gap: 14px; }
}
@media (max-width: 560px) {
  /* Center the whole game vertically and horizontally on the screen. */
  body {
    padding-block: 16px;
    min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; justify-content: center;
  }
  /* Title, counters, hearts, board and hint as one block, centered top to bottom. */
  .wrap { gap: 16px; width: 100%; }
  header { display: contents; }
  h1 { justify-content: center; }
  .status { align-items: center; }
  .hearts { justify-content: center; }
  h1 { font-size: 30px; gap: 6px; }
  .hearts { gap: 4px; }
  .hearts svg { width: 24px; height: 24px; }
  .stats { gap: 6px; }
  .stat { min-width: 0; padding: 5px 9px; border-radius: 10px; }
  .stat b { font-size: 17px; }
  .stat span { font-size: 9.5px; letter-spacing: .06em; }
  .game { --board: min(100%, calc(100dvh - 300px)); }
  .board { border-width: 4px; border-radius: 20px; padding: 2.5%; gap: 1.1%; }
  .tools .btn { font-size: 16px; }
  .card { padding: 24px 18px; }
  .card h2 { font-size: 26px; }
}
@media (max-width: 360px) {
  .stat:last-child { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs id="catdefs"></defs>
</svg>

<div class="wrap">
  <header>
    <h1><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#cat-2"></use></svg>Catdoku</h1>
    <div class="status">
    <div class="stats">
      <div class="stat"><b id="level">1</b><span>Level</span></div>
      <div class="stat"><b id="seated">0/7</b><span>Cats</span></div>
      <div class="stat"><b id="hints">0</b><span>Hints</span></div>
    </div>
    </div>
  </header>

  <div class="game">
    <div class="hearts" id="hearts"></div>
    <div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Catdoku board"></div></div>

    <div class="panel">
      <div class="tools">
        <button type="button" class="btn" id="hintBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>Hint</button>
      </div>

    </div>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="card">
    <div class="parade" id="parade"></div>
    <h2>Every cat found a spot!</h2>
    <p id="winStats"></p>
    <div class="row">
      <button type="button" class="btn" id="viewBtn">View board</button>
      <button type="button" class="btn primary" id="againBtn">Next level</button>
    </div>
  </div>
</div>
<div class="overlay" id="lose" hidden>
  <div class="card">
    <div class="parade"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#cat-1"></use></svg></div>
    <h2>Out of hearts</h2>
    <p>Three cats went in the wrong squares.</p>
    <div class="row">
      <button type="button" class="btn primary" id="retryBtn">Try again</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

    const { reg, sol } = generate(n);
    const level = S ? S.level + (nextLevel ? 1 : 0) : 1;
    S = { n, reg, sol, level, cells: new Array(n * n).fill(EMPTY), known: new Array(n * n).fill(false),
      lives: 3, hints: 0, won: false, lost: false };
    document.getElementById("lose").hidden = true;
    history = []; cursor = 0; lastPlaced = -1;
    document.getElementById("win").hidden = true;
    save(); renderAll();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      if (d && d.reg && d.cells && d.cells.length === d.n * d.n) {
        d.level = d.level || 1; d.lives = d.lives ?? 3;
        d.known = d.known || new Array(d.n * d.n).fill(false);
        return d;
      }
    } catch (e) {}
    return null;
  }

  // Cats that break a rule, plus empty squares a cat could not legally use.
  function analyze() {
    const n = S.n, cats = [];
    S.cells.forEach((v, i) => { if (v === CAT) cats.push(i); });
    const bad = new Set(), blocked = new Set();
    const clash = (a, b) => {
      const ra = a / n | 0, ca = a % n, rb = b / n | 0, cb = b % n;
      return ra === rb || ca === cb || S.reg[a] === S.reg[b] || (Math.abs(ra - rb) < 2 && Math.abs(ca - cb) < 2);
    };
    for (let x = 0; x < cats.length; x++)
      for (let y = x + 1; y < cats.length; y++)
        if (clash(cats[x], cats[y])) { bad.add(cats[x]); bad.add(cats[y]); }
    for (let i = 0; i < n * n; i++)
      if (S.cells[i] === EMPTY && cats.some(c => clash(c, i))) blocked.add(i);
    return { cats, bad, blocked };
  }

  // ---------- Rendering ----------
  const boardEl = document.getElementById("board");

  function renderBoard() {
    const n = S.n, { bad, blocked } = analyze();
    boardEl.style.setProperty("--n", n);
    let html = "";
    for (let i = 0; i < n * n; i++) {
      const r = i / n | 0, c = i % n, v = S.cells[i], k = S.reg[i];
      const cls = ["cell"];
      if (c === n - 1) cls.push("lastc"); else if (S.reg[i + 1] !== k) cls.push("br");
      if (r === n - 1) cls.push("lastr"); else if (S.reg[i + n] !== k) cls.push("bb");
      if (v === CAT && bad.has(i)) cls.push("bad");
      if (i === lastPlaced) cls.push("placed");
      let inner = "";
      if (v === CAT) inner = catSvg(k + 1);
      else if (v === MARK) inner = xSvg(S.known[i] ? "known" : "");
      if (i === wrongAt) cls.push("oops");
      const state = v === CAT ? "cat" : v === MARK ? "marked no cat" : "empty";
      html += `<button type="button" class="${cls.join(" ")}" style="background:var(--r${k + 1})" data-i="${i}" role="gridcell"
        aria-label="Row ${r + 1}, column ${c + 1}, ${CATS[k].name}'s color: ${state}" tabindex="${i === cursor ? 0 : -1}">${inner}</button>`;
    }
    boardEl.innerHTML = html;
    lastPlaced = -1; wrongAt = -1;
  }

  function renderControls() {
    const hearts = document.getElementById("hearts");
    hearts.innerHTML = [0, 1, 2].map(k => HEART.replace("<svg", `<svg class="${k < S.lives ? "full" : "lost"}"`)).join("");
    hearts.setAttribute("aria-label", `${S.lives} ${S.lives === 1 ? "life" : "lives"} left`);
    document.getElementById("level").textContent = S.level;
    document.getElementById("seated").textContent = `${S.cells.filter(v => v === CAT).length}/${S.n}`;
    document.getElementById("hints").textContent = S.hints;
  }
  function renderAll() { renderBoard(); renderControls(); }

  let toastT;
  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800);
  }

  // ---------- Actions ----------
  const snapshot = () => { history.push(S.cells.slice()); if (history.length > 300) history.shift(); };

  function setCell(i, v, record = true) {
    if (S.won || S.lost || S.known[i] || S.cells[i] === v) return false;
    if (record) snapshot();
    // A cat in the wrong square costs a heart, and the square is revealed as empty.
    if (v === CAT && S.sol[i / S.n | 0] !== i % S.n) {
      S.cells[i] = MARK; S.known[i] = true; S.lives--; wrongAt = i;
      if (S.lives <= 0) { S.lost = true; setTimeout(showLose, 500); }
      else toast(`No cat here! ${S.lives} ${S.lives === 1 ? "heart" : "hearts"} left`);
      return true;
    }
    S.cells[i] = v;
    if (v === CAT) lastPlaced = i;
    return true;
  }
  function cycle(i) { if (setCell(i, (S.cells[i] + 1) % 3)) after(); }

  function hint() {
    if (S.won) return;
    const n = S.n, { bad } = analyze();
    // First, take away a cat that is in the wrong spot.
    const wrong = S.cells.findIndex((v, i) => v === CAT && S.sol[i / n | 0] !== i % n);
    snapshot();
    if (wrong >= 0) {
      S.cells[wrong] = EMPTY; cursor = wrong;
      toast(bad.has(wrong) ? "That cat breaks a rule" : "That cat isn't in the right spot");
    } else {
      // Otherwise seat a missing cat, on a mark if the player covered it by mistake.
      const rows = shuffle([...Array(n).keys()]).filter(r => S.cells[r * n + S.sol[r]] !== CAT);
      if (!rows.length) { history.pop(); return; }
      const i = rows[0] * n + S.sol[rows[0]];
      S.cells[i] = CAT; cursor = i; lastPlaced = i;
    }
    S.hints++;
    after();
  }

  function after() {
    const { cats, bad } = analyze();
    if (cats.length === S.n && bad.size === 0) {
      S.won = true;
      setTimeout(showWin, 450);
    }
    save(); renderAll();
  }

  function showWin() {
    const kinds = [...new Set(S.reg)].sort((a, b) => a - b);
    document.getElementById("parade").innerHTML = kinds.map((k, x) =>
      catSvg(k + 1, "").replace("<svg", `<svg style="animation-delay:${x * 0.08}s"`)).join("");
    document.getElementById("winStats").textContent =
      `Level ${S.level} · ${S.n}×${S.n} · ${S.hints} hint${S.hints === 1 ? "" : "s"}`;
    document.getElementById("win").hidden = false;
    document.getElementById("againBtn").focus();
  }

  function showLose() { document.getElementById("lose").hidden = false; document.getElementById("retryBtn").focus(); }
  function retry() {
    S.cells.fill(EMPTY); S.known.fill(false);
    S.lives = 3; S.lost = false; S.hints = 0; history = [];
    document.getElementById("lose").hidden = true;
    save(); renderAll();
  }

  // ---------- Pointer: tap cycles, drag paints marks ----------
  let drag = null;
  const cellAt = (x, y) => document.elementFromPoint(x, y)?.closest?.(".cell");
  boardEl.addEventListener("pointerdown", e => {
    const b = e.target.closest(".cell"); if (!b || S.won || S.lost) return;
    const i = +b.dataset.i;
    cursor = i;
    const paint = S.known[i] ? null : S.cells[i] === EMPTY ? MARK : S.cells[i] === MARK ? EMPTY : null;
    drag = { start: i, moved: false, paint };
    boardEl.setPointerCapture?.(e.pointerId);
  });
  boardEl.addEventListener("pointermove", e => {
    if (!drag || drag.paint === null) return;
    const b = cellAt(e.clientX, e.clientY); if (!b) return;
    const i = +b.dataset.i;
    if (i === drag.start && !drag.moved) return;
    if (!drag.moved) {
      drag.moved = true; snapshot();
      S.cells[drag.start] = drag.paint;
    }
    if (S.cells[i] !== CAT && !S.known[i]) S.cells[i] = drag.paint;
    renderBoard();
  });
  const endDrag = () => {
    if (!drag) return;
    if (drag.moved) after(); else cycle(drag.start);
    drag = null;
    boardEl.querySelector(`[data-i="${cursor}"]`)?.focus({ preventScroll: true });
  };
  boardEl.addEventListener("pointerup", endDrag);
  boardEl.addEventListener("pointercancel", () => { if (drag?.moved) after(); drag = null; });
  boardEl.addEventListener("click", e => { if (e.detail === 0) { const b = e.target.closest(".cell"); if (b) cycle(+b.dataset.i); } });

  // ---------- Controls ----------
  document.getElementById("againBtn").onclick = () => newGame(true);
  document.getElementById("viewBtn").onclick = () => { document.getElementById("win").hidden = true; };
  document.getElementById("hintBtn").onclick = hint;
  document.getElementById("retryBtn").onclick = retry;

  document.addEventListener("keydown", e => {
    if (e.target.matches("input") || e.metaKey || e.ctrlKey) return;
    if (!document.getElementById("win").hidden || S.lost) return;
    const n = S.n, k = e.key.toLowerCase();
    const focusCur = () => { renderBoard(); boardEl.querySelector(`[data-i="${cursor}"]`)?.focus({ preventScroll: true }); };
    if (k === "h") { hint(); return; }
    if (k === " " || k === "enter") { if (e.target.closest(".cell") || k === " ") { e.preventDefault(); cycle(cursor); focusCur(); } return; }
    if (k === "x") { if (setCell(cursor, S.cells[cursor] === MARK ? EMPTY : MARK)) after(); focusCur(); return; }
    if (k === "c") { if (setCell(cursor, S.cells[cursor] === CAT ? EMPTY : CAT)) after(); focusCur(); return; }
    if (k === "backspace" || k === "delete") { e.preventDefault(); if (setCell(cursor, EMPTY)) after(); focusCur(); return; }
    const moves = { arrowup: [-1, 0], arrowdown: [1, 0], arrowleft: [0, -1], arrowright: [0, 1] };
    if (moves[k]) {
      e.preventDefault();
      const r = cursor / n | 0, c = cursor % n, [dr, dc] = moves[k];
      cursor = ((r + dr + n) % n) * n + (c + dc + n) % n;
      focusCur();
    }
  });

  // ---------- Boot ----------
  S = load();
  if (S) { renderAll(); if (S.lost) showLose(); }
  else newGame(false);
})();
</script>
</body>
</html>
